name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:run
      - run: pnpm --filter @leetcode-daily/extension build
      - run: pnpm run extension:check
      - run: pnpm run extension:package
      - uses: actions/upload-artifact@v4
        with:
          name: leetcode-daily-extension
          path: release/leetcode-daily-*.zip
          if-no-files-found: error
      - run: pnpm --filter @leetcode-daily/api build
      - run: pnpm run worker:smoke

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: extension-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: leetcode-daily-extension
          path: release
      - name: Update versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          tag="v${version}"
          asset="release/leetcode-daily-${version}.zip"

          test -s "$asset"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --latest
          else
            gh release create "$tag" "$asset" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --generate-notes \
              --latest
          fi
